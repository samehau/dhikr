<!DOCTYPE html>
<html lang="dv" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zikoro | ނަޞޭޙަތް ތަފްސީލް</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@400;600;700&display=swap');
        body { font-family: 'Anek Malayalam', sans-serif; }
        @keyframes shimmer { 0% { background-position: -1000px 0; } 100% { background-position: 1000px 0; } }
        .skeleton { background: #e2e8f0; background-image: linear-gradient(to right, #e2e8f0 0%, #f8fafc 20%, #e2e8f0 40%, #e2e8f0 100%); background-repeat: no-repeat; background-size: 1000px 100%; animation: shimmer 2s infinite linear forwards; }
        .fade-in { animation: fadeIn 0.4s ease-in-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">

    <header class="bg-[#0f764a] w-full h-20 relative z-40 border-b border-gray-200">
        <div class="container mx-auto px-4 h-full flex justify-between items-center relative">
            <div class="flex items-center h-full pr-28">
                <div class="absolute right-4 top-2 w-24 h-24 bg-white rounded-xl shadow-sm border-[3px] border-[#0f764a] flex items-center justify-center p-1 z-50">
                    <img src="Asset/logo.png" alt="Zikoro Logo" class="w-full h-full object-contain" onerror="this.style.display='none'">
                </div>
                <h1 class="text-white text-3xl font-bold">ޒިކުރު</h1> 
            </div>

            <button id="mobile-menu-btn" class="md:hidden text-white p-2 focus:outline-none">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>

            <!-- Navigation Links -->
            <ul class="hidden md:flex space-x-3 space-x-reverse text-lg font-bold items-end h-full">
                <li class="pb-3"><a href="index.html" class="block text-white px-4 hover:text-gray-200 transition">ފުރަތަމަ ޞަފްޙާ</a></li>
                <!-- Active Tab -->
                <li class="h-full flex items-end relative top-[1px]">
                    <a href="nasehai.html" class="block bg-gray-50 text-[#0f764a] px-6 py-3 rounded-t-lg border-t border-l border-r border-gray-200">ނަޞޭޙަތް</a>
                </li>
                <li class="pb-3"><a href="darus.html" class="block text-white px-4 hover:text-gray-200 transition">ދަރުސް</a></li>
                <li class="pb-3"><a href="event.html" class="block text-white px-4 hover:text-gray-200 transition">އިވެންޓް</a></li>
                <li class="pb-3"><a href="members.html" class="block text-white px-4 hover:text-gray-200 transition">ޖަމުއިއްޔާ</a></li>
            </ul>
        </div>

        <div id="mobile-menu" class="hidden absolute top-20 left-0 w-full bg-[#0f764a] shadow-xl md:hidden flex-col z-30 border-t border-emerald-800 text-lg">
            <a href="index.html" class="p-4 border-b border-emerald-800 text-white font-bold hover:bg-emerald-800 transition">ފުރަތަމަ ޞަފްޙާ</a>
            <a href="nasehai.html" class="p-4 border-b border-emerald-800 text-white font-bold bg-emerald-900">ނަޞޭޙަތް</a>
            <a href="darus.html" class="p-4 border-b border-emerald-800 text-white font-bold hover:bg-emerald-800 transition">ދަރުސް</a>
            <a href="event.html" class="p-4 border-b border-emerald-800 text-white font-bold hover:bg-emerald-800 transition">އިވެންޓް</a>
            <a href="members.html" class="p-4 text-white font-bold hover:bg-emerald-800 transition">ޖަމުއިއްޔާ</a>
        </div>
    </header>

    <main class="container mx-auto mt-8 px-4 md:px-10 pb-12 flex-grow">
        
        <!-- Back Button -->
        <a href="nasehai.html" class="inline-flex items-center text-[#0f764a] font-bold mb-6 hover:text-emerald-800 transition group">
            <svg class="w-5 h-5 ml-2 transform rotate-180 group-hover:-translate-x-1 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            ފަހަތަށް (Back)
        </a>

        <!-- Content Container -->
        <div id="detail-container" class="bg-white rounded-xl shadow-md overflow-hidden max-w-4xl mx-auto border border-gray-100">
            <!-- Loading Skeletons -->
            <div id="loading-skeleton" class="w-full">
                <div class="skeleton aspect-video w-full"></div>
                <div class="p-8">
                    <div class="skeleton h-8 w-1/2 mb-6"></div>
                    <div class="skeleton h-4 w-full mb-3"></div>
                    <div class="skeleton h-4 w-full mb-3"></div>
                    <div class="skeleton h-4 w-3/4"></div>
                </div>
            </div>
            
            <!-- Real Content Injected Here -->
            <div id="real-content" class="hidden fade-in"></div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="mt-auto pb-8 relative overflow-hidden">
        <div class="flex items-center justify-center mb-4 relative px-4">
            <div class="w-full h-px bg-[#0f764a] absolute top-1/2"></div>
            <div class="w-12 h-12 bg-gray-50 rounded-full flex items-center justify-center z-10 p-1">
                <img src="Asset/logo.png" alt="Icon" class="w-full h-full object-contain" onerror="this.style.display='none'">
            </div>
        </div>
        <div class="text-center text-gray-500 font-bold text-sm flex flex-col md:flex-row items-center justify-center space-y-2 md:space-y-0 md:space-x-2 md:space-x-reverse">
            <svg class="w-5 h-5 text-gray-500 hover:text-[#0f764a] cursor-pointer" fill="currentColor" viewBox="0 0 24 24"><path d="M22.675 0h-21.35C.597 0 0 .597 0 1.325v21.351C0 23.403.597 24 1.325 24H12.82v-9.294H9.692v-3.622h3.128V8.413c0-3.1 1.893-4.788 4.659-4.788 1.325 0 2.463.099 2.795.143v3.24l-1.918.001c-1.504 0-1.795.715-1.795 1.763v2.313h3.587l-.467 3.622h-3.12V24h6.116C23.403 24 24 23.403 24 22.675V1.325C24 .597 23.403 0 22.675 0z"/></svg>
            <span>Copyright © 2026 | dhikr.mv | Dhikr | M.Mulah</span>
        </div>
    </footer>

    <script>
        const APPS_SCRIPT_URL = "YOUR_APPS_SCRIPT_WEB_APP_URL"; // REPLACE THIS

        const btn = document.getElementById('mobile-menu-btn');
        const menu = document.getElementById('mobile-menu');
        btn.addEventListener('click', () => { menu.classList.toggle('hidden'); menu.classList.toggle('flex'); });

        function getDriveDirectLink(url) {
            if (!url) return '';
            const match = url.match(/\/d\/(.+?)\//);
            return match ? `https://drive.google.com/thumbnail?id=${match[1]}&sz=w1000` : url;
        }

        function renderItem(item) {
            document.getElementById('loading-skeleton').classList.add('hidden');
            const contentDiv = document.getElementById('real-content');
            contentDiv.classList.remove('hidden');
            
            const imgUrl = getDriveDirectLink(item["Image URL"]);
            
            // Format details to keep line breaks if they exist in the Google Sheet
            const formattedDetail = item.Detail.replace(/\n/g, '<br>');

            contentDiv.innerHTML = `
                ${imgUrl ? `<div class="w-full bg-gray-200 flex items-center justify-center border-b border-gray-100">
                    <img src="${imgUrl}" class="w-full h-auto max-h-[500px] object-cover">
                </div>` : ''}
                <div class="p-8 md:p-12">
                    <h2 class="text-3xl font-bold text-[#0f764a] mb-6 leading-tight">${item.Title}</h2>
                    <p class="text-gray-700 text-lg leading-relaxed font-semibold">${formattedDetail}</p>
                </div>
            `;
        }

        function showError() {
            document.getElementById('loading-skeleton').classList.add('hidden');
            const contentDiv = document.getElementById('real-content');
            contentDiv.classList.remove('hidden');
            contentDiv.innerHTML = `<div class="p-12 text-center text-red-500 font-bold text-xl">މަޢުލޫމާތު ފެންނަން ނެތް (Item not found)</div>`;
        }

        async function loadDetail() {
            // Get ID from URL
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            if (!id) return showError();

            // Try to load from browser memory first (Instant Load)
            const cachedData = sessionStorage.getItem('zikoro_data');
            if (cachedData) {
                const item = JSON.parse(cachedData).nasehai.find(i => i.Timestamp === id);
                if (item) return renderItem(item);
            }

            // If not in memory (User clicked a direct link), fetch from Apps Script
            try {
                const response = await fetch(APPS_SCRIPT_URL);
                const data = await response.json();
                sessionStorage.setItem('zikoro_data', JSON.stringify(data));
                
                const item = data.nasehai.find(i => i.Timestamp === id);
                if (item) renderItem(item);
                else showError();
            } catch (error) {
                showError();
            }
        }

        window.addEventListener('DOMContentLoaded', loadDetail);
    </script>
</body>
</html>
